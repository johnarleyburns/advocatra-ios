# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Portable logic (Linux, Swift 6.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift tests
        run: swift test
