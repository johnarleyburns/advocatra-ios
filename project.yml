# SPDX-License-Identifier: AGPL-3.0-only
name: Advocatra
options:
  bundleIdPrefix: guru.parso
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Advocatra:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ADVOCATRA_SOURCE_COMMIT: main
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Advocatra:
    type: application
    platform: iOS
    sources:
      - path: Advocatra
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: Advocatra
        product: AdvocatraCore
      - package: Advocatra
        product: AdvocatraVault
    info:
      path: Advocatra/Resources/Info.plist
      properties:
        CFBundleDisplayName: Advocatra
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AdvocatraSourceCommit: "$(ADVOCATRA_SOURCE_COMMIT)"
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock your vault's stored key without re-entering your passphrase.
        UIDesignRequiresCompatibility: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.advocatra
        PRODUCT_NAME: Advocatra
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
